<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Invoice Manager — Aqua Québec</title>
<style>
:root{
  --bg:#0a0d14;--surf:#111827;--card:#161f2e;--card2:#1e293b;
  --brd:rgba(255,255,255,0.06);--brd2:rgba(255,255,255,0.12);
  --acc:#f59e0b;--acc2:rgba(245,158,11,0.12);--acc3:rgba(245,158,11,0.25);
  --txt:#f1f5f9;--dim:#94a3b8;--faint:#334155;
  --ok:#10b981;--ok2:rgba(16,185,129,0.12);
  --err:#ef4444;--err2:rgba(239,68,68,0.12);
  --blue:#3b82f6;--blue2:rgba(59,130,246,0.12);
  --r:12px;--r2:8px;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --font-mono:"SF Mono","Fira Code","Consolas","Courier New",monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);font-family:var(--font-sans);color:var(--txt)}
body{overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:4px}
input,textarea,select{font-family:var(--font-sans);background:var(--card2);border:1px solid var(--brd2);color:var(--txt);border-radius:var(--r2);padding:9px 12px;width:100%;font-size:13px;outline:none;transition:border .15s;-webkit-appearance:none;}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
input::placeholder,textarea::placeholder{color:var(--faint)}
select option{background:#1e293b}
button{font-family:var(--font-sans);cursor:pointer;transition:all .15s}
textarea{resize:vertical;min-height:80px;line-height:1.6}
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:220px;min-width:220px;background:var(--surf);border-right:1px solid var(--brd);display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{padding:24px 18px 20px;border-bottom:1px solid var(--brd)}
.sb-logo-name{font-size:18px;font-weight:800;letter-spacing:-.02em}
.sb-logo-name em{color:var(--acc);font-style:normal}
.sb-logo-sub{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:3px}
.sb-nav{flex:1;padding:12px 10px;overflow-y:auto}
.sb-sec{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:12px 8px 6px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r2);font-size:13px;font-weight:500;color:var(--dim);cursor:pointer;border:none;background:none;width:100%;text-align:left;position:relative}
.nav-btn:hover{background:rgba(255,255,255,0.04);color:var(--txt)}
.nav-btn.active{background:var(--acc2);color:var(--acc);font-weight:600}
.nav-badge{margin-left:auto;background:var(--err);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.sb-foot{padding:14px;border-top:1px solid var(--brd);font-size:11px;color:var(--faint);line-height:1.7}
.sb-foot strong{color:var(--dim);display:block;margin-bottom:2px}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.topbar{height:60px;background:var(--surf);border-bottom:1px solid var(--brd);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0}
.topbar-title h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
.topbar-title p{font-size:11px;color:var(--dim);margin-top:1px}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.page{flex:1;overflow-y:auto;padding:24px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r2);font-size:13px;font-weight:600;border:none;cursor:pointer;white-space:nowrap;transition:all .15s}
.btn-primary{background:var(--acc);color:#000}.btn-primary:hover{background:#fbbf24;transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,0.05);color:var(--dim);border:1px solid var(--brd2)}.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--txt)}
.btn-danger{background:var(--err2);color:var(--err);border:1px solid rgba(239,68,68,.2)}.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-success{background:var(--ok2);color:var(--ok);border:1px solid rgba(16,185,129,.2)}.btn-success:hover{background:rgba(16,185,129,.2)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-icon{padding:7px;border-radius:var(--r2);background:rgba(255,255,255,0.04);border:1px solid var(--brd);color:var(--dim)}.btn-icon:hover{background:rgba(255,255,255,0.08);color:var(--txt)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.badge-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r)}
.lbl{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.fg{margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.panel{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.panel-hd{padding:12px 18px;border-bottom:1px solid var(--brd);background:rgba(255,255,255,0.02);display:flex;align-items:center;gap:8px}
.panel-hd-title{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.panel-body{padding:18px}
.inv-kstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.inv-kcard{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:12px}
.inv-kcard-ico{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.inv-kcard-lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.inv-kcard-val{font-size:20px;font-weight:800;letter-spacing:-.03em;font-family:var(--font-mono);line-height:1}
.inv-kcard-sub{font-size:11px;color:var(--faint);margin-top:3px}
.inv-tabs{display:flex;border:1px solid var(--brd);border-radius:10px;overflow:hidden;background:var(--card);flex-wrap:wrap}
.itab{padding:7px 13px;font-size:12px;font-weight:600;color:var(--dim);border:none;background:none;cursor:pointer;border-right:1px solid var(--brd);display:flex;align-items:center;gap:5px;transition:all .15s}
.itab:last-child{border-right:none}
.itab:hover{color:var(--txt);background:rgba(255,255,255,0.03)}
.itab.on{background:var(--acc2);color:var(--acc)}
.itab-cnt{font-size:10px;background:rgba(255,255,255,0.07);padding:1px 5px;border-radius:8px;font-weight:700}
.inv-list{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);overflow:hidden}
.inv-list-hd{display:grid;grid-template-columns:130px 1fr 110px 110px 100px 120px 120px 96px;gap:8px;padding:9px 18px;background:rgba(255,255,255,0.02);border-bottom:1px solid var(--brd)}
.inv-list-hd span{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.inv-row{display:grid;grid-template-columns:130px 1fr 110px 110px 100px 120px 120px 96px;gap:8px;padding:13px 18px;border-bottom:1px solid var(--brd);cursor:pointer;transition:background .12s;align-items:center}
.inv-row:last-child{border-bottom:none}
.inv-row:hover{background:var(--card2)}
.inv-num{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--acc)}
.inv-client-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-client-sub{font-size:11px;color:var(--dim);margin-top:2px}
.inv-date{font-size:12px;color:var(--dim)}
.inv-amt{font-family:var(--font-mono);font-size:13px;font-weight:700}
.inv-actions{display:flex;gap:4px;justify-content:flex-end}
.inv-footer{padding:10px 18px;background:rgba(255,255,255,0.02);border-top:1px solid var(--brd);display:flex;gap:20px;font-size:12px;color:var(--dim)}
.inv-empty{padding:60px 20px;text-align:center;color:var(--dim)}
.form-wrap{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.form-sidebar{position:sticky;top:0;display:flex;flex-direction:column;gap:12px}
.preview-wrap{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
.preview-sidebar{position:sticky;top:0;display:flex;flex-direction:column;gap:10px}
.pv-card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);overflow:hidden}
.pv-card-hd{padding:12px 14px;border-bottom:1px solid var(--brd);background:rgba(255,255,255,0.02)}
.pv-card-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.pv-card-val{font-size:17px;font-weight:800;font-family:var(--font-mono);color:var(--acc)}
.pv-rows{padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.pv-row-lbl{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
.pv-row-val{font-size:12px;font-weight:600;color:var(--txt)}
.pv-actions{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px}
.pv-actions-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.inv-doc{background:#fff;color:#1e293b;border-radius:var(--r);padding:44px;box-shadow:0 20px 50px rgba(0,0,0,.4);font-family:var(--font-sans)}
.quote-doc{background:#fff;color:#1e293b;border-radius:12px;padding:44px;box-shadow:0 20px 50px rgba(0,0,0,.4);font-family:var(--font-sans)}
.contract-doc{background:#fff;color:#1e293b;border-radius:var(--r);padding:48px;box-shadow:0 20px 50px rgba(0,0,0,.4);font-family:var(--font-sans);font-size:13px;line-height:1.8;max-width:800px;margin:0 auto}
.contract-doc h1{font-size:22px;font-weight:800;text-align:center;color:#0f172a;margin-bottom:4px}
.contract-doc h2{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#0f172a;margin:20px 0 8px}
.contract-doc .party{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px 16px;margin:8px 0;color:#334155;line-height:1.9}
.contract-doc .sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:32px;padding-top:24px;border-top:2px solid #e2e8f0}
.contract-doc .sig-line{border-top:1px solid #334155;padding-top:8px;margin-top:28px;font-size:11px;color:#64748b}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--brd2);border-radius:var(--r);width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-hd{padding:16px 20px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card)}
.modal-hd h2{font-size:15px;font-weight:700}
.modal-body{padding:20px}
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.client-card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:16px;transition:all .2s}
.client-card:hover{border-color:var(--brd2);transform:translateY(-2px)}
.avatar{width:38px;height:38px;border-radius:9px;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.settings-card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:20px;margin-bottom:14px}
.settings-title{font-size:13px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.sbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--brd2);border-radius:var(--r2);padding:8px 12px}
.sbar input{background:none;border:none;padding:0;font-size:13px;flex:1;outline:none;color:var(--txt)}
.exp-kstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.exp-kcard{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px}
.exp-kcard-ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.exp-kcard-lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.exp-kcard-val{font-size:20px;font-weight:800;font-family:var(--font-mono);letter-spacing:-.02em;line-height:1}
.exp-kcard-sub{font-size:11px;color:var(--dim);margin-top:3px}
.exp-list{background:var(--card);border:1px solid var(--brd);border-radius:12px;overflow:hidden}
.exp-list-hd{display:grid;grid-template-columns:110px 1fr 130px 130px 100px 80px;gap:8px;padding:9px 18px;background:rgba(255,255,255,0.02);border-bottom:1px solid var(--brd)}
.exp-list-hd span{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.exp-row{display:grid;grid-template-columns:110px 1fr 130px 130px 100px 80px;gap:8px;padding:13px 18px;border-bottom:1px solid var(--brd);cursor:pointer;transition:background .12s;align-items:center}
.exp-row:last-child{border-bottom:none}
.exp-row:hover{background:var(--card2)}
.exp-date{font-size:12px;color:var(--dim)}
.exp-desc{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-vendor{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-cat-badge{display:inline-flex;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.exp-amt{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--err)}
.exp-footer{padding:10px 18px;background:rgba(255,255,255,0.02);border-top:1px solid var(--brd);display:flex;gap:20px;font-size:12px;color:var(--dim)}
.exp-actions{display:flex;gap:4px;justify-content:flex-end}
.cat-bar-bg{flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:4px;transition:width .5s ease}
.quote-kstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.quote-list{background:var(--card);border:1px solid var(--brd);border-radius:12px;overflow:hidden}
.quote-list-hd{display:grid;grid-template-columns:130px 1fr 110px 110px 100px 130px 100px;gap:8px;padding:9px 18px;background:rgba(255,255,255,0.02);border-bottom:1px solid var(--brd)}
.quote-list-hd span{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.quote-row{display:grid;grid-template-columns:130px 1fr 110px 110px 100px 130px 100px;gap:8px;padding:13px 18px;border-bottom:1px solid var(--brd);cursor:pointer;transition:background .12s;align-items:center}
.quote-row:last-child{border-bottom:none}
.quote-row:hover{background:var(--card2)}
.quote-num{font-family:var(--font-mono);font-size:13px;font-weight:600;color:#8b5cf6}
.quote-footer{padding:10px 18px;background:rgba(255,255,255,0.02);border-top:1px solid var(--brd);display:flex;gap:20px;font-size:12px;color:var(--dim)}
.li-table{width:100%;border-collapse:collapse}
.li-table th{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:8px;text-align:left;border-bottom:1px solid var(--brd);background:rgba(255,255,255,0.02)}
.li-table td{padding:5px 4px;border-bottom:1px solid var(--brd);vertical-align:top}
.li-table tr:last-child td{border-bottom:none}
.li-table input{padding:7px 8px;font-size:12px;border-radius:6px}
.li-total{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--acc);text-align:right;padding:9px 4px;display:block}
.preview-mob-bar{display:none}
.mobile-nav{display:none}
.fab{display:none}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadein .2s ease}
@media(max-width:768px){
  .sb{display:none}.app{flex-direction:column}.main{width:100vw}
  body{overflow:hidden}
  .topbar{padding:0 14px;height:58px}
  .topbar-title h1{font-size:16px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar-title p{display:none}
  .btn-label{display:none}
  .page{padding:14px;padding-bottom:84px}
  .inv-kstrip,.exp-kstrip,.quote-kstrip{grid-template-columns:1fr 1fr}
  .inv-list-hd{display:none}
  .inv-row{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px}
  .form-wrap,.preview-wrap{grid-template-columns:1fr}
  .g2,.g3,.g4{grid-template-columns:1fr!important}
  .exp-list-hd{display:none}
  .exp-row{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px}
  .quote-list-hd{display:none}
  .quote-row{display:flex;flex-wrap:wrap;gap:5px 10px;padding:14px}
  .settings-card{padding:16px}
  .modal{max-width:100%!important;border-radius:16px 16px 0 0!important;position:fixed!important;bottom:0!important;left:0!important;right:0!important;max-height:88vh!important;margin:0!important}
  .modal-ov{align-items:flex-end!important;padding:0!important}
  .preview-mob-bar{display:flex;align-items:center;justify-content:space-between;background:var(--surf);border-bottom:1px solid var(--brd);padding:11px 14px;position:sticky;top:58px;z-index:150;gap:10px}
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;background:var(--surf);border-top:1px solid var(--brd);z-index:300;padding:0 4px;padding-bottom:env(safe-area-inset-bottom)}
  .mob-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;border:none;background:none;color:var(--dim);font-size:10px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;font-family:var(--font-sans);position:relative;-webkit-tap-highlight-color:transparent}
  .mob-nav-btn.active{color:var(--acc)}
  .mob-nav-btn .nav-badge{position:absolute;top:3px;left:calc(50% + 5px);margin:0;font-size:9px;padding:1px 4px;min-width:16px}
  .fab{display:flex;position:fixed;bottom:72px;right:16px;z-index:290;width:54px;height:54px;border-radius:50%;background:var(--acc);color:#000;border:none;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 20px var(--acc3);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .dash-kgrid{grid-template-columns:1fr 1fr!important}
  .dash-mid{grid-template-columns:1fr!important}
  .dash-bot{grid-template-columns:1fr!important}
  .contract-doc{padding:20px!important}
  .contract-doc .sig-grid{grid-template-columns:1fr!important}
}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body *{visibility:hidden!important}
  body.print-invoice .inv-doc,body.print-invoice .inv-doc *,
  body.print-quote .quote-doc,body.print-quote .quote-doc *,
  body.print-contract .contract-doc,body.print-contract .contract-doc *,
  body.print-week #ts-print-area,body.print-week #ts-print-area *,
  body.print-emp-report #emp-pay-report,body.print-emp-report #emp-pay-report *{visibility:visible!important}
  body.print-invoice .inv-doc,body.print-quote .quote-doc,body.print-contract .contract-doc{position:absolute!important;top:0!important;left:0!important;width:100%!important;padding:24px!important;margin:0!important;box-shadow:none!important;border-radius:0!important;background:#fff!important}
  body.print-week #ts-print-area{position:absolute!important;top:0!important;left:0!important;width:100%!important;background:#fff!important}
  body.print-emp-report #emp-pay-report{display:block!important;position:absolute!important;top:0!important;left:0!important;width:100%!important;background:#fff!important}
  @page{margin:.6cm;size:A4}
}

.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.emp-card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:16px;transition:all .2s;cursor:pointer}
.emp-card:hover{border-color:var(--brd2);transform:translateY(-2px)}
.ts-table{width:100%;border-collapse:collapse;font-size:12px}

function saveInv(inv){

  if(exists){S.invoices=S.invoices.map(i=>i.id===inv.id?inv:i);}
  else{nid=uid();const prefix=S.co.prefix||'INV';const ni={...inv,id:nid,number:inv.number||`${prefix}-${S.co.nextNum}`,createdAt:today()};S.co={...S.co,nextNum:S.co.nextNum+1};S.invoices=[ni,...S.invoices];}
  UI.formState=null;persist();goPreview(nid);toast("Invoice saved");
}

function chStatus(id,status){

}
function saveQuote(q){

  if(exists){S.quotes=S.quotes.map(x=>x.id===q.id?q:x);}
  else{nid=uid();S.quotes=[{...q,id:nid,number:q.number||`AQ-Q-${String(S.co.nextNum).padStart(3,"0")}`,createdAt:today()},...S.quotes];}

function convertToInvoice(qid){
  const q=S.quotes.find(x=>x.id===qid);if(!q)return;
  const nid=uid();
  const ni={id:nid,number:(S.co.prefix?`${S.co.prefix}-${S.co.nextNum}`:`INV-${S.co.nextNum}`),status:"sent",clientId:q.clientId,currency:q.currency,issueDate:today(),dueDate:addDays(today(),30),paymentTerms:S.co.defaultPaymentTerms,items:q.items.map(it=>({...it,id:uid()})),notes:q.notes,terms:S.co.defaultTerms,depositAmount:0,depositDate:null,paidAmount:0,paidDate:null,fromQuote:q.number,createdAt:today()};
  S.invoices=[ni,...S.invoices];S.co={...S.co,nextNum:S.co.nextNum+1};
  S.quotes=S.quotes.map(x=>x.id===qid?{...x,status:"accepted",convertedToInvoice:nid}:x);
  persist();S.view="invoices";S.page="preview";S.selId=nid;S.qPage=null;S.qSelId=null;render();toast(`Converted to invoice ${ni.number}`);
}
function saveClient(c){const exists=S.clients.find(x=>x.id===c.id);S.clients=exists?S.clients.map(x=>x.id===c.id?c:x):[c,...S.clients];persist();UI.clientEditing=undefined;render();toast("Client saved");}
function delClient(id){S.clients=S.clients.filter(c=>c.id!==id);persist();render();toast("Client removed","err");}
function saveExpense(exp){const exists=S.expenses.find(e=>e.id===exp.id);S.expenses=exists?S.expenses.map(e=>e.id===exp.id?exp:e):[exp,...S.expenses];persist();UI.expEditing=undefined;render();toast("Expense saved");}
function delExpense(id){S.expenses=S.expenses.filter(e=>e.id!==id);persist();render();toast("Expense deleted","err");}
function exportBackup(){
  const blob=new Blob([JSON.stringify({invoices:S.invoices,quotes:S.quotes,clients:S.clients,co:S.co,expenses:S.expenses,exportedAt:new Date().toISOString(),version:"2.0"},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`aq-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href);toast("Backup downloaded");
}
function handleImport(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{const data=JSON.parse(ev.target.result);
    if(!data.invoices||!data.clients||!data.co){toast("Invalid backup file","err");return;}
    if(!confirm("Restore backup? This replaces all current data."))return;
    Object.assign(S,{invoices:data.invoices,clients:data.clients,co:data.co});
    if(data.expenses)S.expenses=data.expenses;if(data.quotes)S.quotes=data.quotes;if(data.employees)S.employees=data.employees;if(data.timesheets)S.timesheets=data.timesheets;if(data.empPayments)S.empPayments=data.empPayments;
    persist();render();toast("Backup restored");}
    catch(e){toast("Failed to read backup","err");}
  };reader.readAsText(file);input.value="";
}
function resetAllData(){
  if(!confirm("Reset ALL data to defaults? Cannot be undone."))return;
  try{localStorage.removeItem(LS);}catch(e){}
  Object.assign(S,{invoices:DEF_INVOICES,quotes:DEF_QUOTES,clients:DEF_CLIENTS,co:DEF_CO,expenses:DEF_EXPENSES,employees:[],timesheets:[],empPayments:[],view:"dashboard",page:null,selId:null,qPage:null,qSelId:null});
  render();toast("Reset to defaults","err");
}

// ═══════ INVOICE LIST ═══════
function renderInvoiceList(){
  const tabs=["all","draft","sent","paid","overdue","partial","cancelled"];
  let list=[...S.invoices].sort((a,b)=>b.createdAt>a.createdAt?1:-1);
  if(UI.invTab!=="all")list=list.filter(i=>UI.invTab==="overdue"?isOverdue(i):i.status===UI.invTab);
  if(UI.invQ){const q=UI.invQ.toLowerCase();list=list.filter(i=>{const cl=S.clients.find(c=>c.id===i.clientId);return i.number.toLowerCase().includes(q)||(cl&&cl.name.toLowerCase().includes(q));});}
  const totI=list.reduce((a,i)=>a+calcTotals(i.items).total,0);
  const cntTab=t=>t==="all"?S.invoices.length:t==="overdue"?S.invoices.filter(i=>isOverdue(i)).length:S.invoices.filter(i=>i.status===t).length;
  const stat=(st,ic,c,bg)=>{const v=S.invoices.filter(i=>i.status===st).reduce((a,i)=>a+calcTotals(i.items).total,0);const n=S.invoices.filter(i=>i.status===st).length;return`<div class="inv-kcard"><div class="inv-kcard-ico" style="background:${bg}">${svg(IC[ic],20,c)}</div><div><div class="inv-kcard-lbl">${st.charAt(0).toUpperCase()+st.slice(1)}</div><div class="inv-kcard-val" style="color:${c}">${fc(v,S.co.currency)}</div><div class="inv-kcard-sub">${n} invoices</div></div></div>`;};
  return`<div class="fadein">
  <div class="inv-kstrip">
    ${stat("paid","check","#10b981","rgba(16,185,129,.12)")}
    <div class="inv-kcard"><div class="inv-kcard-ico" style="background:rgba(245,158,11,.12)">${svg(IC.clock,20,"#f59e0b")}</div><div><div class="inv-kcard-lbl">Outstanding</div><div class="inv-kcard-val" style="color:#f59e0b">${fc(S.invoices.filter(i=>["sent","partial"].includes(i.status)).reduce((a,i)=>a+Math.max(0,calcTotals(i.items).total-(i.paidAmount||0)),0),S.co.currency)}</div><div class="inv-kcard-sub">${S.invoices.filter(i=>["sent","partial"].includes(i.status)).length} pending</div></div></div>
    ${stat("overdue","alert","#ef4444","rgba(239,68,68,.12)")}
    <div class="inv-kcard"><div class="inv-kcard-ico" style="background:rgba(59,130,246,.12)">${svg(IC.invoice,20,"#3b82f6")}</div><div><div class="inv-kcard-lbl">Total Invoiced</div><div class="inv-kcard-val" style="color:#3b82f6">${fc(S.invoices.reduce((a,i)=>a+calcTotals(i.items).total,0),S.co.currency)}</div><div class="inv-kcard-sub">${S.invoices.length} invoices</div></div></div>
  </div>
  <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
    <div class="inv-tabs">${tabs.map(t=>`<button class="itab${UI.invTab===t?" on":""}" data-action="inv-tab" data-tab="${t}">${t.charAt(0).toUpperCase()+t.slice(1)}<span class="itab-cnt">${cntTab(t)}</span></button>`).join("")}</div>
    <div class="sbar" style="flex:1;max-width:280px">${svg(IC.search,14,"var(--faint)")}<input placeholder="Search..." value="${esc(UI.invQ)}" oninput="UI.invQ=this.value;render()"/></div>
  </div>
  <div class="inv-list">
    <div class="inv-list-hd"><span>Invoice #</span><span>Client</span><span>Issued</span><span>Due</span><span>Status</span><span>Total</span><span>Balance</span><span style="text-align:right">Actions</span></div>
    ${list.length===0?`<div class="inv-empty" style="padding:60px 20px;text-align:center"><div style="font-weight:700;font-size:14px;margin-bottom:6px">No invoices found</div><button class="btn btn-primary btn-sm" data-action="go-new" style="margin-top:14px">${svg(IC.plus,13)} New Invoice</button></div>`:""}
    ${list.map(inv=>{const cl=S.clients.find(c=>c.id===inv.clientId);const t=calcTotals(inv.items);const bal=Math.max(0,t.total-(inv.depositAmount||0)-(inv.paidAmount||0));const eff=inv.status==="sent"&&isOverdue(inv)?"overdue":inv.status;
    return`<div class="inv-row" data-action="view-inv" data-id="${inv.id}"><div class="inv-num">${esc(inv.number)}</div><div><div class="inv-client-name">${esc(cl?cl.name:"No client")}</div></div><div class="inv-date">${fd(inv.issueDate)}</div><div class="inv-date" style="color:${isOverdue(inv)?"var(--err)":"var(--dim)"}">${fd(inv.dueDate)}</div><div>${bdg(eff)}</div><div class="inv-amt">${fc(t.total,inv.currency)}</div><div style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:${bal>0&&eff!=="paid"?"var(--err)":"var(--ok)"}">${eff==="paid"?"Paid":fc(bal,inv.currency)}</div><div class="inv-actions" onclick="event.stopPropagation()">${ibtn(IC.edit,"Edit",`data-action="go-edit" data-id="${inv.id}"`)}${ibtn(IC.trash,"Delete",`data-action="del-inv-confirm" data-id="${inv.id}"`)}</div></div>`;}).join("")}
    ${list.length>0?`<div class="inv-footer"><span><strong>${list.length}</strong> invoices</span><span>Total: <strong style="color:var(--acc);font-family:var(--font-mono)">${fc(totI,S.co.currency)}</strong></span></div>`:""}
  </div></div>`;
}

// ═══════ QUOTE FORM ═══════

        <div style="padding:10px 14px;border-top:1px solid var(--brd)"><button class="btn btn-ghost btn-sm" data-action="add-qli">${svg(IC.plus,13)} Add Line</button></div>
      </div>

        <div class="fg"><label class="lbl">Terms</label><textarea data-qbind="terms">${esc(ff.terms)}</textarea></div>
      </div></div></div>

        <button class="btn btn-danger" data-action="q-cancel" style="justify-content:center">${svg(IC.x,14)} Discard</button>
      </div>
    </div>
  </div></div>`;
}

// ═══════ QUOTE PREVIEW ═══════
function renderQuotePreview(quote){
  const co=S.co,client=S.clients.find(c=>c.id===quote.clientId)||{};

  const eff=expired&&quote.status==="sent"?"expired":quote.status;
  const qs=QSTATUS[eff]||QSTATUS.draft;
  const daysLeft=Math.ceil((new Date(quote.expiryDate+"T00:00:00")-new Date())/(1000*60*60*24));
  return`<div class="fadein">

        <button class="btn btn-ghost btn-sm" data-action="go-qedit" data-id="${quote.id}" style="justify-content:center;width:100%">${svg(IC.edit,13)} Edit Quote</button>

    ${list.map(q=>{const cl=S.clients.find(c=>c.id===q.clientId);const t=calcTotals(q.items);const expired=!["accepted","declined"].includes(q.status)&&new Date(q.expiryDate+"T00:00:00")<new Date();const eff=expired&&q.status==="sent"?"expired":q.status;
    return`<div class="quote-row" data-action="view-quote" data-id="${q.id}"><div class="quote-num">${esc(q.number)}</div><div><div class="inv-client-name">${esc(cl?cl.name:"No client")}</div></div><div class="inv-date">${fd(q.issueDate)}</div><div class="inv-date">${fd(q.expiryDate)}</div><div>${bdg(eff,QSTATUS)}</div><div class="inv-amt" style="color:#8b5cf6">${fc(t.total,q.currency)}</div><div class="inv-actions" onclick="event.stopPropagation()">${ibtn(IC.edit,"Edit",`data-action="go-qedit" data-id="${q.id}"`)}${ibtn(IC.trash,"Delete",`data-action="del-quote-confirm" data-id="${q.id}"`)}</div></div>`;}).join("")}

// ═══════ DASHBOARD ═══════
function renderDashboard(){
  const {invoices,quotes,clients,co,expenses}=S;
  const totalPaid=invoices.filter(i=>i.status==="paid").reduce((a,i)=>a+calcTotals(i.items).total,0);
  const totalInv=invoices.reduce((a,i)=>a+calcTotals(i.items).total,0);
  const outstanding=invoices.filter(i=>["sent","partial"].includes(i.status)).reduce((a,i)=>a+Math.max(0,calcTotals(i.items).total-(i.paidAmount||0)),0);
  const overdue=invoices.filter(i=>isOverdue(i)).reduce((a,i)=>a+Math.max(0,calcTotals(i.items).total-(i.paidAmount||0)),0);
  const totalExp=expenses.reduce((a,e)=>a+(e.amount||0),0);
  const nOverdue=invoices.filter(i=>isOverdue(i)).length;
  const nPaid=invoices.filter(i=>i.status==="paid").length;
  const colRate=totalInv>0?Math.round((totalPaid/totalInv)*100):0;
  const h=new Date().getHours();
  const months=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);months.push({label:d.toLocaleDateString("en-CA",{month:"short"}),y:d.getFullYear(),m:d.getMonth()});}
  const mData=months.map(({label,y,m})=>{const mi=invoices.filter(i=>{const d=new Date(i.issueDate+"T00:00:00");return d.getFullYear()===y&&d.getMonth()===m;});return{label,rev:mi.filter(i=>i.status==="paid").reduce((a,i)=>a+calcTotals(i.items).total,0),inv:mi.reduce((a,i)=>a+calcTotals(i.items).total,0)};});
  const maxB=Math.max(...mData.map(m=>Math.max(m.rev,m.inv)),1);
  const recent=[...invoices].sort((a,b)=>b.createdAt>a.createdAt?1:-1).slice(0,5);
  const overdueList=invoices.filter(i=>isOverdue(i)).slice(0,3);
  return`<div class="fadein">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <div><div style="font-size:20px;font-weight:800;letter-spacing:-.02em">Good ${h<12?"morning":h<17?"afternoon":"evening"} 👋</div><div style="font-size:13px;color:var(--dim);margin-top:3px">Here's what's happening with <strong style="color:var(--txt)">${esc(co.name)}</strong></div></div>
    <button class="btn btn-primary" data-action="go-new">${svg(IC.plus,14)} New Invoice</button>
  </div>
  <div class="dash-kgrid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px">
    ${[{l:"Total Invoiced",v:fc(totalInv,co.currency),sub:`${invoices.length} invoices`,c:"#3b82f6",ic:"invoice"},{l:"Collected",v:fc(totalPaid,co.currency),sub:`${nPaid} paid`,c:"#10b981",ic:"check"},{l:"Outstanding",v:fc(outstanding,co.currency),sub:"pending",c:"#f59e0b",ic:"clock"},{l:"Overdue",v:fc(overdue,co.currency),sub:`${nOverdue} invoice${nOverdue!==1?"s":""}`,c:"#ef4444",ic:"alert"},{l:"Net Profit",v:fc(totalPaid-totalExp,co.currency),sub:`${colRate}% collected`,c:totalPaid-totalExp>=0?"#10b981":"#ef4444",ic:"dollar"}].map(k=>`<div style="background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden"><div style="position:absolute;top:0;left:0;right:0;height:3px;background:${k.c};border-radius:12px 12px 0 0"></div><div style="width:36px;height:36px;border-radius:9px;background:${k.c}18;display:flex;align-items:center;justify-content:center;margin-bottom:10px">${svg(IC[k.ic],18,k.c)}</div><div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:4px">${k.l}</div><div style="font-size:22px;font-weight:800;letter-spacing:-.03em;font-family:var(--font-mono)">${k.v}</div><div style="font-size:11px;color:var(--dim);margin-top:5px">${k.sub}</div></div>`).join("")}
  </div>
  <div class="dash-mid" style="display:grid;grid-template-columns:1fr 260px;gap:12px;margin-bottom:12px">
    <div style="background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:20px">
      <div style="font-size:14px;font-weight:700;margin-bottom:4px">Revenue Overview</div>
      <div style="font-size:11px;color:var(--dim);margin-bottom:16px">Last 6 months · ${svg(IC.trend,12,"#10b981")} collected vs invoiced</div>
      <div style="display:flex;align-items:flex-end;gap:8px;height:120px">
        ${mData.map(m=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:100%;display:flex;gap:2px;align-items:flex-end;height:96px"><div style="flex:1;border-radius:4px 4px 0 0;background:rgba(59,130,246,0.2);border:1px solid rgba(59,130,246,0.3);height:${Math.max((m.inv/maxB)*90,m.inv>0?4:0)}px"></div><div style="flex:1;border-radius:4px 4px 0 0;background:#10b981;opacity:.85;height:${Math.max((m.rev/maxB)*90,m.rev>0?4:0)}px"></div></div><div style="font-size:10px;color:var(--dim);font-weight:600">${m.label}</div></div>`).join("")}
      </div>
      <div style="display:flex;gap:16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--brd)">
        <div><div style="font-size:10px;color:var(--faint);font-weight:700;text-transform:uppercase">6-mo Collected</div><div style="font-size:16px;font-weight:800;color:#10b981;font-family:var(--font-mono);margin-top:2px">${fc(mData.reduce((a,m)=>a+m.rev,0))}</div></div>
        <div style="margin-left:auto"><div style="font-size:10px;color:var(--faint);font-weight:700;text-transform:uppercase">Collection Rate</div><div style="font-size:16px;font-weight:800;color:${colRate>70?"#10b981":"#f59e0b"};font-family:var(--font-mono);margin-top:2px">${colRate}%</div></div>
      </div>
    </div>
    <div style="background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:20px">
      <div style="font-size:14px;font-weight:700;margin-bottom:16px">Invoice Status</div>
      ${Object.entries(STATUS).map(([s,info])=>{const n=invoices.filter(i=>i.status===s).length;if(!n)return"";const pct=Math.round((n/invoices.length)*100);return`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)"><span style="width:7px;height:7px;border-radius:2px;background:${info.c};display:inline-block"></span>${info.label}</span><span style="font-size:12px;font-weight:700;color:${info.c}">${n}</span></div><div style="height:4px;border-radius:4px;background:rgba(255,255,255,0.06);overflow:hidden"><div style="height:100%;width:${pct}%;background:${info.c};border-radius:4px;opacity:.85"></div></div></div>`;}).join("")}
    </div>
  </div>
  <div class="dash-bot" style="display:grid;grid-template-columns:1fr 240px;gap:12px">
    <div style="background:var(--card);border:1px solid var(--brd);border-radius:12px;overflow:hidden">
      <div style="padding:14px 18px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between"><div style="font-size:14px;font-weight:700">Recent Invoices</div><button class="btn btn-ghost btn-sm" data-action="go-new">${svg(IC.plus,13)} New</button></div>
      ${recent.map(inv=>{const cl=S.clients.find(c=>c.id===inv.clientId);const t=calcTotals(inv.items);const eff=inv.status==="sent"&&isOverdue(inv)?"overdue":inv.status;const bal=Math.max(0,t.total-(inv.paidAmount||0));return`<div data-action="view-inv" data-id="${inv.id}" style="display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--brd);cursor:pointer" onmouseover="this.style.background='var(--card2)'" onmouseout="this.style.background=''"><div style="width:34px;height:34px;border-radius:8px;background:${STATUS[eff]?STATUS[eff].bg:"rgba(148,163,184,.13)"};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:${STATUS[eff]?STATUS[eff].c:"var(--dim)"};flex-shrink:0">${cl?ini(cl.name):"?"}</div><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:8px;margin-bottom:2px"><span style="font-size:12px;font-family:var(--font-mono);font-weight:600;color:var(--acc)">${esc(inv.number)}</span>${bdg(eff)}</div><div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(cl?cl.name:"No client")}</div></div><div style="text-align:right;flex-shrink:0"><div style="font-size:13px;font-weight:700;font-family:var(--font-mono)">${fc(t.total,inv.currency)}</div><div style="font-size:11px;color:${bal>0&&eff!=="paid"?"var(--err)":"var(--ok)"};margin-top:2px">${eff==="paid"?"Paid":"Due "+fd(inv.dueDate)}</div></div></div>`;}).join("")}
      ${recent.length===0?`<div style="padding:28px;text-align:center;color:var(--faint);font-size:13px">No invoices yet. Create your first one!</div>`:""}
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:16px">
        <div style="font-size:13px;font-weight:700;margin-bottom:14px">Top Clients</div>
        ${clients.slice(0,4).map(c=>{const ci=invoices.filter(i=>i.clientId===c.id);const rev=ci.filter(i=>i.status==="paid").reduce((a,i)=>a+calcTotals(i.items).total,0);return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><div style="width:28px;height:28px;border-radius:7px;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0">${ini(c.name)}</div><div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</div><div style="font-size:10px;color:var(--dim)">${ci.length} invoice${ci.length!==1?"s":""}</div></div><div style="font-size:12px;font-weight:700;font-family:var(--font-mono);color:var(--ok)">${fc(rev)}</div></div>`;}).join("")}
      </div>
      ${overdueList.length>0?`<div style="background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.2);border-radius:12px;padding:14px"><div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">${svg(IC.alert,14,"var(--err)")}<span style="font-size:12px;font-weight:700;color:var(--err)">Overdue</span></div>${overdueList.map(inv=>{const cl=S.clients.find(c=>c.id===inv.clientId);const bal=Math.max(0,calcTotals(inv.items).total-(inv.paidAmount||0));return`<div data-action="view-inv" data-id="${inv.id}" style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(239,68,68,0.15);cursor:pointer"><div style="min-width:0"><div style="font-size:11px;font-weight:700;font-family:var(--font-mono)">${esc(inv.number)}</div><div style="font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px">${esc(cl?cl.name:"")}</div></div><div style="font-size:12px;font-weight:700;color:var(--err);font-family:var(--font-mono)">${fc(bal)}</div></div>`;}).join("")}</div>`:""}
    </div>
  </div></div>`;
}

// ═══════ HELPERS: TIME MATH ═══════
function parseTime(t){
  if(!t||!t.trim())return null;
  const m=t.trim().match(/^(\d{1,2}):(\d{2})\s*(am|pm)?$/i);
  if(!m)return null;
  let h=+m[1],mn=+m[2];
  if(m[3]){const ap=m[3].toLowerCase();if(ap==="pm"&&h!==12)h+=12;if(ap==="am"&&h===12)h=0;}
  return h*60+mn;
}
function minsToH(m){if(m==null||isNaN(m))return"0.00";return(m/60).toFixed(2);}
function calcShift(clockIn,clockOut,b1in,b1out,b2in,b2out){
  const ci=parseTime(clockIn),co=parseTime(clockOut);
  if(ci==null||co==null)return{worked:0,reg:0,ot:0};
  let raw=co-ci;if(raw<0)raw+=1440;
  let brk=0;
  const b1i=parseTime(b1in),b1o=parseTime(b1out);
  if(b1i!=null&&b1o!=null){let d=b1o-b1i;if(d<0)d+=1440;brk+=d;}
  const b2i=parseTime(b2in),b2o=parseTime(b2out);
  if(b2i!=null&&b2o!=null){let d=b2o-b2i;if(d<0)d+=1440;brk+=d;}
  const worked=Math.max(0,raw-brk);
  return{worked,reg:worked,ot:0};
}
function applyOT(dailyMins,weeklyMins,rule,afterH,otRate){
  // rule: "daily" = OT after X hrs/day; "weekly" = OT after X hrs/week
  const afterM=afterH*60;
  let reg,ot;
  if(rule==="daily"){
    reg=Math.min(dailyMins,afterM);
    ot=Math.max(0,dailyMins-afterM);
  } else {
    // weekly: all regular until threshold reached
    const prevReg=Math.min(weeklyMins,afterM);
    const nowReg=Math.min(weeklyMins+dailyMins,afterM);
    reg=nowReg-prevReg;
    ot=dailyMins-reg;
  }
  return{reg:Math.max(0,reg),ot:Math.max(0,ot)};
}
function getWeekStart(dateStr){
  const d=new Date(dateStr+"T00:00:00");
  const day=d.getDay(); // 0=Sun
  d.setDate(d.getDate()-day);
  return d.toISOString().split("T")[0];
}
function getWeekDates(weekStart){
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date(weekStart+"T00:00:00");
    d.setDate(d.getDate()+i);
    days.push(d.toISOString().split("T")[0]);
  }
  return days;
}
function weekLabel(weekStart){
  const d=new Date(weekStart+"T00:00:00");
  const e=new Date(d);e.setDate(e.getDate()+6);
  return d.toLocaleDateString("en-CA",{month:"short",day:"numeric"})+" – "+e.toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"});
}
function addWeek(weekStart,n){
  const d=new Date(weekStart+"T00:00:00");
  d.setDate(d.getDate()+n*7);
  return d.toISOString().split("T")[0];
}
function getOrCreateSheet(empId,weekStart){
  let sheet=S.timesheets.find(t=>t.empId===empId&&t.weekStart===weekStart);
  if(!sheet){
    const days=getWeekDates(weekStart);
    sheet={id:uid(),empId,weekStart,
      rows:days.map(date=>({date,vessel:"",clockIn:"",clockOut:"",b1in:"",b1out:"",b2in:"",b2out:"",notes:""})),
      travel:[]
    };
  }
  return sheet;
}
function saveSheet(sheet){
  const exists=S.timesheets.find(t=>t.id===sheet.id);
  if(exists)S.timesheets=S.timesheets.map(t=>t.id===sheet.id?sheet:t);
  else S.timesheets=[...S.timesheets,sheet];
  persist();
}

            </tr>`).join("")}

            <td colspan="4" style="padding:8px 10px;text-align:right;font-size:11px;color:var(--dim)">TOTAL TRAVEL</td>

    <div id="ts-print-area" style="display:none">

    </div>`;
  }

  if(empTab==="history"){
    const empId=UI.histEmpId||S.employees[0]?.id||null;
    const emp=S.employees.find(e=>e.id===empId);
    const co=S.co;
    const otRule=co.otRule||"daily",otAfter=co.otAfter||8,otRate=co.otRate||1.5;
    const sheets=S.timesheets.filter(t=>t.empId===empId).sort((a,b)=>b.weekStart>a.weekStart?1:-1);
    const payments=(S.empPayments||[]).filter(p=>p.empId===empId).sort((a,b)=>b.date>a.date?1:-1);
    const PAY_METHODS=["Cash","Cheque","E-Transfer","Direct Deposit","Other"];

    // Compute totals across all weeks
    let grandW=0,grandR=0,grandO=0,grandTrvl=0,grandGross=0;
    sheets.forEach(sheet=>{
      let wkly=0;
      sheet.rows.forEach(row=>{
        const {worked}=calcShift(row.clockIn,row.clockOut,row.b1in,row.b1out,row.b2in,row.b2out);
        const {reg,ot}=applyOT(worked,wkly,otRule,otAfter,otRate);
        wkly+=worked;grandW+=worked;grandR+=reg;grandO+=ot;
      });
      const trvl=(sheet.travel||[]).reduce((a,t)=>a+(+t.hrs||0),0);
      grandTrvl+=trvl;
      if(emp?.payType!=="salary"){
        const payRate=emp?.payRate||0;
        grandGross+=(grandR/60)*payRate; // recalc below
      }
    });
    // recalc grandGross properly
    grandGross=0;
    sheets.forEach(sheet=>{
      let wkly=0,tR=0,tO=0;
      sheet.rows.forEach(row=>{
        const {worked}=calcShift(row.clockIn,row.clockOut,row.b1in,row.b1out,row.b2in,row.b2out);
        const {reg,ot}=applyOT(worked,wkly,otRule,otAfter,otRate);
        wkly+=worked;tR+=reg;tO+=ot;
      });
      const trvl=(sheet.travel||[]).reduce((a,t)=>a+(+t.hrs||0),0);
      const payRate=emp?.payRate||0;
      if(emp?.payType!=="salary") grandGross+=(tR/60)*payRate+(tO/60)*payRate*otRate+trvl*payRate;
    });
    const totalPaid=payments.reduce((a,p)=>a+(+p.amount||0),0);
    const balance=grandGross-totalPaid;

    // Payment form state
    const pf=UI.empPayEditing;

    return`<div class="fadein">
    <div style="display:flex;gap:3px;margin-bottom:18px;align-items:center;border-bottom:1px solid var(--brd);padding-bottom:12px">
      <div class="emp-tabs">
        <button class="itab" data-action="emp-tab" data-tab="roster">Roster</button>
        <button class="itab" data-action="emp-tab" data-tab="timesheet">Timesheets</button>
        <button class="itab on" data-action="emp-tab" data-tab="history">History</button>
        <button class="itab" data-action="emp-tab" data-tab="ot-settings">OT Settings</button>
      </div>
      ${emp?`<div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" data-action="emp-print-report" data-empid="${empId}">${svg(IC.print,13)} Print Report</button>
        <button class="btn btn-primary btn-sm" data-action="emp-add-payment" data-empid="${empId}">${svg(IC.plus,13)} Log Payment</button>
      </div>`:""}
    </div>
    ${!S.employees.length?`<div style="text-align:center;padding:40px;color:var(--dim)">No employees yet.</div>`:`
    <div style="display:flex;gap:12px;margin-bottom:16px;align-items:center;flex-wrap:wrap">
      <select id="hist-emp-sel" style="width:220px;padding:8px 12px">
        ${S.employees.map(e=>`<option value="${e.id}"${e.id===empId?" selected":""}>${esc(e.name)}</option>`).join("")}
      </select>
      <div style="font-size:12px;color:var(--dim)">${sheets.length} week${sheets.length!==1?"s":""} logged</div>
    </div>

    ${pf?`
    <!-- Payment form -->
    <div class="card" style="padding:20px;max-width:560px;margin-bottom:20px;border-color:var(--acc3)">
      <div style="font-size:13px;font-weight:700;margin-bottom:16px;color:var(--acc)">${svg(IC.dollar,14,"var(--acc)")} ${pf._isEdit?"Edit Payment":"Log Payment"} — ${esc(emp?.name||"")}</div>
      <div id="pay-form-root" data-pid="${pf.id||""}">
        <div class="g2">
          <div class="fg"><label class="lbl">Date</label><input type="date" id="pf-date" value="${pf.date||today()}"/></div>
          <div class="fg"><label class="lbl">Amount ($)</label><input type="number" id="pf-amount" value="${pf.amount||""}" step="0.01" min="0" placeholder="0.00"/></div>
          <div class="fg"><label class="lbl">Payment Method</label><select id="pf-method">${PAY_METHODS.map(m=>`<option${(pf.method||"E-Transfer")===m?" selected":""}>${m}</option>`).join("")}</select></div>
          <div class="fg"><label class="lbl">Hours This Payment Covers <span style="font-weight:400;color:var(--faint)">(optional)</span></label><input type="number" id="pf-hours" value="${pf.hours||""}" step="0.5" min="0" placeholder="e.g. 40"/></div>
        </div>
        <div class="fg"><label class="lbl">Notes <span style="font-weight:400;color:var(--faint)">(optional)</span></label><input id="pf-notes" value="${esc(pf.notes||"")}" placeholder="e.g. Week of June 2, regular pay"/></div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px">
        <button class="btn btn-ghost btn-sm" data-action="emp-pay-cancel">Cancel</button>
        <button class="btn btn-primary btn-sm" data-action="emp-pay-save" data-empid="${empId}">${svg(IC.save,13)} Save Payment</button>
      </div>
    </div>`:""}

    <!-- Summary KPI strip -->
    ${emp?`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
      ${[
        {l:"Total Hours Worked",v:minsToH(grandW)+"h",sub:`${minsToH(grandR)}h reg · ${minsToH(grandO)}h OT`,c:"#3b82f6",ic:"clock"},
        {l:"Gross Earned",v:emp.payType==="salary"?"Salary":fc(grandGross),sub:emp.payType==="salary"?"See payroll":"Based on timesheets",c:"#f59e0b",ic:"dollar"},
        {l:"Total Paid",v:fc(totalPaid),sub:`${payments.length} payment${payments.length!==1?"s":""}`,c:"#10b981",ic:"check"},
        {l:"Balance Owing",v:emp.payType==="salary"?"—":fc(Math.max(0,balance)),sub:emp.payType!=="salary"&&balance<=0?"Fully paid":balance>0?"Unpaid balance":"",c:balance>0&&emp.payType!=="salary"?"#ef4444":"#94a3b8",ic:"bank"},
      ].map(k=>`<div style="background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:10px">
        <div style="width:38px;height:38px;border-radius:9px;background:${k.c}18;display:flex;align-items:center;justify-content:center;flex-shrink:0">${svg(IC[k.ic],18,k.c)}</div>
        <div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:3px">${k.l}</div><div style="font-size:16px;font-weight:800;font-family:var(--font-mono);color:${k.c}">${k.v}</div><div style="font-size:11px;color:var(--dim);margin-top:2px">${k.sub}</div></div>
      </div>`).join("")}
    </div>`:""}

    <!-- Timesheet history table -->
    <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:8px">Timesheet History</div>
    <div style="background:var(--card);border:1px solid var(--brd);border-radius:var(--r);overflow:hidden;margin-bottom:20px">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="background:rgba(255,255,255,0.02)">
          <th style="padding:10px 14px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--brd)">Week</th>
          <th style="padding:10px 14px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--brd)">Regular</th>
          <th style="padding:10px 14px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--brd)">Overtime</th>
          <th style="padding:10px 14px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--brd)">Total Hrs</th>
          <th style="padding:10px 14px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--brd)">Travel</th>
          <th style="padding:10px 14px;text-align:right;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--brd)">Gross Pay</th>
          <th style="padding:10px 14px;text-align:right;border-bottom:1px solid var(--brd)"></th>
        </tr></thead>
        <tbody>
          ${sheets.length===0?`<tr><td colspan="7" style="padding:40px;text-align:center;color:var(--faint)">No timesheets recorded yet.</td></tr>`:""}
          ${sheets.map(sheet=>{
            let wkly=0,totW=0,totR=0,totO=0;
            sheet.rows.forEach(row=>{
              const {worked}=calcShift(row.clockIn,row.clockOut,row.b1in,row.b1out,row.b2in,row.b2out);
              const {reg,ot}=applyOT(worked,wkly,otRule,otAfter,otRate);
              wkly+=worked;totW+=worked;totR+=reg;totO+=ot;
            });
            const trvl=(sheet.travel||[]).reduce((a,t)=>a+(+t.hrs||0),0);
            const payRate=emp?.payRate||0;
            const gross=emp?.payType==="salary"?null:(totR/60)*payRate+(totO/60)*payRate*otRate+(trvl*payRate);
            return`<tr style="border-bottom:1px solid var(--brd)" onmouseover="this.style.background='var(--card2)'" onmouseout="this.style.background=''">
              <td style="padding:12px 14px;font-weight:600">${weekLabel(sheet.weekStart)}</td>
              <td style="padding:12px 14px;text-align:center;color:var(--ok);font-family:var(--font-mono);font-weight:700">${minsToH(totR)}h</td>
              <td style="padding:12px 14px;text-align:center;color:#f97316;font-family:var(--font-mono);font-weight:700">${minsToH(totO)}h</td>
              <td style="padding:12px 14px;text-align:center;color:var(--acc);font-family:var(--font-mono);font-weight:800">${minsToH(totW)}h</td>
              <td style="padding:12px 14px;text-align:center;color:var(--dim);font-family:var(--font-mono)">${trvl>0?trvl.toFixed(2)+"h":"—"}</td>
              <td style="padding:12px 14px;text-align:right;font-family:var(--font-mono);font-weight:700;color:var(--blue)">${gross!=null?fc(gross):"—"}</td>
              <td style="padding:12px 14px;text-align:right">
                <button class="btn btn-ghost btn-sm" data-action="open-sheet" data-empid="${emp?.id}" data-week="${sheet.weekStart}" style="padding:4px 10px;font-size:11px">View</button>
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>

    <!-- Payment log -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
      <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)">Payment Log</div>
      ${emp?`<button class="btn btn-ghost btn-sm" data-action="emp-add-payment" data-empid="${empId}" style="padding:3px 10px;font-size:11px">${svg(IC.plus,11)} Add</button>`:""}
    </div>
    <div style="background:var(--card);border:1px solid var(--brd);border-radius:var(--r);overflow:hidden">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="background:rgba(255,255,255,0.02)">
          <th style="padding:10px 14px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--brd)">Date</th>
          <th style="padding:10px 14px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--brd)">Method</th>
          <th style="padding:10px 14px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--brd)">Hours Covered</th>
          <th style="padding:10px 14px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--brd)">Notes</th>
          <th style="padding:10px 14px;text-align:right;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--brd)">Amount</th>
          <th style="padding:10px 14px;border-bottom:1px solid var(--brd)"></th>
        </tr></thead>
        <tbody>
          ${payments.length===0?`<tr><td colspan="6" style="padding:40px;text-align:center;color:var(--faint)">No payments logged yet. Click "Log Payment" to record a payment.</td></tr>`:""}
          ${payments.map(p=>{
            const METHOD_COLORS={"Cash":"#10b981","Cheque":"#3b82f6","E-Transfer":"#8b5cf6","Direct Deposit":"#f59e0b","Other":"#94a3b8"};
            const mc=METHOD_COLORS[p.method]||"#94a3b8";
            return`<tr style="border-bottom:1px solid var(--brd)" onmouseover="this.style.background='var(--card2)'" onmouseout="this.style.background=''">
              <td style="padding:12px 14px;font-weight:600;color:var(--txt)">${fd(p.date)}</td>
              <td style="padding:12px 14px"><span style="display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:${mc}18;color:${mc}">${esc(p.method||"—")}</span></td>
              <td style="padding:12px 14px;text-align:center;font-family:var(--font-mono);color:var(--dim)">${p.hours>0?p.hours+"h":"—"}</td>
              <td style="padding:12px 14px;color:var(--dim);font-size:12px">${esc(p.notes||"—")}</td>
              <td style="padding:12px 14px;text-align:right;font-family:var(--font-mono);font-weight:800;color:var(--ok)">${fc(p.amount)}</td>
              <td style="padding:12px 14px;text-align:right;display:flex;gap:4px;justify-content:flex-end">
                ${ibtn(IC.edit,"Edit",`data-action="emp-edit-payment" data-pid="${p.id}" data-empid="${empId}"`)}
                ${ibtn(IC.trash,"Delete",`data-action="emp-del-payment" data-pid="${p.id}" data-empid="${empId}"`)}
              </td>
            </tr>`;
          }).join("")}
          ${payments.length>0?`<tr style="background:rgba(255,255,255,0.02)">
            <td colspan="4" style="padding:10px 14px;font-size:12px;font-weight:700;color:var(--faint);text-align:right">TOTAL PAID</td>
            <td style="padding:10px 14px;text-align:right;font-family:var(--font-mono);font-weight:800;font-size:15px;color:var(--ok)">${fc(totalPaid)}</td>
            <td></td>
          </tr>`:""}
        </tbody>
      </table>
    </div>

    <!-- Hidden printable pay report -->
    <div id="emp-pay-report" style="display:none">
      ${emp?renderEmpPayReport(emp,sheets,payments,otRule,otAfter,otRate):""}
    </div>
    `}
    </div>`;
  }

  if(empTab==="ot-settings"){
    const co=S.co;
    return`<div class="fadein">
    <div style="display:flex;gap:3px;margin-bottom:18px;align-items:center;border-bottom:1px solid var(--brd);padding-bottom:12px">
      <div class="emp-tabs">
        <button class="itab" data-action="emp-tab" data-tab="roster">Roster</button>
        <button class="itab" data-action="emp-tab" data-tab="timesheet">Timesheets</button>
        <button class="itab" data-action="emp-tab" data-tab="history">History</button>
        <button class="itab on" data-action="emp-tab" data-tab="ot-settings">OT Settings</button>
      </div>
    </div>
    <div class="card" style="padding:24px;max-width:520px">
      <div style="font-size:15px;font-weight:700;margin-bottom:6px">${svg(IC.clock,15,"var(--acc)")} Overtime Rules</div>
      <div style="font-size:12px;color:var(--dim);margin-bottom:22px;line-height:1.7">Configure when overtime kicks in and the pay multiplier. Changes apply to all future timesheet calculations.</div>
      <div id="ot-form">
        <div class="fg"><label class="lbl">Overtime Rule</label>
          <select data-ot="otRule">
            <option value="daily"${(co.otRule||"daily")==="daily"?" selected":""}>Daily — OT after X hours per day</option>
            <option value="weekly"${co.otRule==="weekly"?" selected":""}>Weekly — OT after X hours per week</option>
          </select>
        </div>
        <div class="g2">
          <div class="fg"><label class="lbl">Overtime Threshold (hours)</label>
            <input type="number" data-ot="otAfter" value="${co.otAfter||8}" min="1" max="168" step="0.5" placeholder="8"/>
            <div style="font-size:11px;color:var(--faint);margin-top:5px">e.g. 8 for daily, 40 for weekly</div>
          </div>
          <div class="fg"><label class="lbl">OT Pay Multiplier</label>
            <input type="number" data-ot="otRate" value="${co.otRate||1.5}" min="1" max="4" step="0.25" placeholder="1.5"/>
            <div style="font-size:11px;color:var(--faint);margin-top:5px">e.g. 1.5× or 2×</div>
          </div>
        </div>
        <div style="background:var(--acc2);border:1px solid var(--acc3);border-radius:10px;padding:14px 16px;margin-bottom:18px;font-size:12px;line-height:1.8">
          <strong style="color:var(--acc)">Current rule:</strong> Overtime applies ${co.otRule==="weekly"?`after <strong>${co.otAfter||40} hours in a week`:`after <strong>${co.otAfter||8} hours in a single day`}</strong>, paid at <strong>${co.otRate||1.5}×</strong> the regular rate.
        </div>
        <button class="btn btn-primary" data-action="save-ot-settings">${svg(IC.save,13)} Save OT Settings</button>
      </div>
    </div>
    </div>`;
  }

  return`<div>Unknown tab</div>`;
}

        body:"The Contractor shall exercise reasonable care in performing services. The Contractor shall not be liable for: pre-existing damage or defects; normal wear and tear; indirect, consequential, or punitive damages; or delays caused by weather, port authority restrictions, or circumstances beyond reasonable control (force majeure). Total liability shall not exceed the value of the invoice giving rise to the claim, pursuant to the Civil Code of Québec."},

      {id:"cl11",on:true,title:"11. Privacy (PIPEDA / Loi 25)",
        body:"The Parties agree to handle all personal information in compliance with the Personal Information Protection and Electronic Documents Act (S.C. 2000, c. 5) (PIPEDA) and the Act Respecting the Protection of Personal Information in the Private Sector (CQLR c. P-39.1), as amended by Law 25. Personal information shall be collected, used, and disclosed only as necessary to perform this Agreement."},
      {id:"cl12",on:true,title:"12. Language (Charte de la langue française)",
        body:"The Parties acknowledge that this Agreement has been drafted in English at the express wish of the Parties. Les parties reconnaissent que cette convention a été rédigée en anglais à la demande expresse des parties, conformément à la Charte de la langue française (CQLR c. C-11)."},
      {id:"cl13",on:true,title:"13. Occupational Health & Safety (LSST)",
        body:"The Contractor shall comply with all requirements of the Act Respecting Occupational Health and Safety (CQLR c. S-2.1) (LSST) and all regulations thereunder. The Contractor shall ensure all workers receive required training and personal protective equipment. Any workplace accident shall be reported to the CNESST as required by law."},
      {id:"cl14",on:true,title:"14. Environmental Compliance",
        body:"The Contractor shall comply with the Environment Quality Act (CQLR c. Q-2) and all applicable federal and provincial environmental regulations. Waste disposal shall be performed in accordance with applicable laws, and no hazardous substances shall be disposed of in violation of environmental regulations."},
      {id:"cl15",on:true,title:"15. Dispute Resolution",
        body:"In the event of a dispute, the Parties agree to first attempt resolution through good-faith negotiation for a period of thirty (30) days. If unresolved, disputes shall be submitted to mediation before any court proceedings. Any litigation shall be brought exclusively before the courts of the Province of Québec having jurisdiction, pursuant to the Code of Civil Procedure (CQLR c. C-25.01)."},
      {id:"cl16",on:true,title:"16. Governing Law",
        body:"This Agreement shall be governed by and construed in accordance with the laws of the Province of Québec and the applicable federal laws of Canada, including the Civil Code of Québec (S.Q. 1991, c. 64). Any dispute shall fall under the exclusive jurisdiction of the courts of Québec."},
      {id:"cl17",on:true,title:"17. Entire Agreement and Amendments",
        body:"This Agreement constitutes the entire agreement between the Parties and supersedes all prior negotiations, representations, warranties, understandings, or agreements. Any amendment must be in writing and signed by authorized representatives of both Parties."},
      {id:"cl18",on:false,title:"18. Non-Solicitation",
        body:"During the term of this Agreement and for a period of twelve (12) months following termination, neither Party shall directly solicit or hire the other Party's employees or subcontractors who were involved in performing this Agreement, without prior written consent."},

        body:"All work product, reports, and deliverables created by the Contractor in performing services under this Agreement shall remain the property of the Contractor unless otherwise agreed in writing. The Client is granted a non-exclusive licence to use deliverables solely for the purposes contemplated by this Agreement."},

  };

  const cd=UI.contractData;
  const TABS=[
    {v:"client",l:"1. Parties",ic:"clients"},
    {v:"payment",l:"2. Payment",ic:"dollar"},
    {v:"services",l:"3. Services",ic:"pkg"},
    {v:"clauses",l:"4. Clauses",ic:"contract"},
    {v:"preview",l:"5. Preview",ic:"invoice"},

  const tabIdx=TABS.findIndex(t=>t.v===tab);
  const prevTab=tabIdx>0?TABS[tabIdx-1]:null;
  const nextTab=tabIdx<TABS.length-1?TABS[tabIdx+1]:null;

  function resolve(text){
    // Payment clause substitution
    let pc="";
    if(cd.payMode==="hourly")pc=`Services are billed at $${cd.rate} per hour. Overtime hours are billed at ${cd.otRate}× the regular hourly rate.`;
    else if(cd.payMode==="monthly")pc=`Services are billed at a fixed monthly rate of $${cd.monthlyRate} per month.`;
    else if(cd.payMode==="yearly")pc=`Services are billed at a fixed annual rate of $${cd.yearlyRate} per year.`;
    else if(cd.payMode==="fixed")pc=`Services are billed at a fixed amount of $${cd.fixedAmount} for: ${cd.fixedDesc||"the scope of work described herein"}.`;
    const ann=(+cd.latePct*12).toFixed(0);
    return text
      .replace(/PAYMENT_CLAUSE/g,pc)
      .replace(/START_DATE/g,cd.startDate?fd(cd.startDate):"[start date]")
      .replace(/PAY_DAYS/g,cd.payDays||"30")
      .replace(/LATE_PCT/g,cd.latePct||"2")
      .replace(/LATE_ANN/g,ann)
      .replace(/LATE_PENALTY/g,cd.latePenalty||"50")
      .replace(/GST_RATE/g,cd.gst||"5")
      .replace(/QST_RATE/g,cd.qst||"9.975")
      .replace(/INSURANCE/g,cd.insurance||"2,000,000")
      .replace(/DEP_PCT/g,cd.depPct||"25")
      .replace(/DEP_THRESH/g,cd.depThresh||"5,000")
      .replace(/OT_RATE/g,cd.otRate||"1.5")
      .replace(/RATE/g,cd.rate||"35.00");
  }

  const aS=cd.services.filter(s=>s.on);

  // ── NAV BAR (shared) ──

      ${prevTab?`<button class="btn btn-ghost btn-sm" data-action="contract-tab" data-tab="${prevTab.v}">${svg(IC.back,13)} Back</button>`:""}

  // ── TAB: PARTIES ──
  if(tab==="client") return`<div class="fadein">${navBar}

  // ── TAB: CLAUSES ──
  if(tab==="clauses") return`<div class="fadein">${navBar}

    <div style="background:var(--blue2);border:1px solid rgba(59,130,246,.25);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:12px;color:var(--dim);line-height:1.7">

      <div style="border-top:1px solid var(--brd);padding-top:14px;margin-top:8px">

  // ── TAB: PREVIEW ──
  if(tab==="preview"){

    else if(cd.payMode==="fixed")payLine=`Fixed: $${cd.fixedAmount}`;
    return`<div class="fadein">${navBar}
    <div class="contract-doc">
      <!-- Header -->
      <div style="text-align:center;margin-bottom:28px;padding-bottom:20px;border-bottom:3px solid #f59e0b">
        <div style="font-size:22px;font-weight:800;color:#0f172a;letter-spacing:-.01em">${esc(cd.contractTitle)}</div>
        <div style="font-size:12px;color:#64748b;margin-top:4px">(${esc(cd.jurisdiction)})</div>
