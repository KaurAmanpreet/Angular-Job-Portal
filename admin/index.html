      <!-- Signatures -->
      <div style="margin-top:36px;padding-top:24px;border-top:2px solid #e2e8f0">
        <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8;margin-bottom:20px">SIGNATURES</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px">
          <div>
            <div style="font-weight:800;font-size:13px;color:#0f172a;margin-bottom:4px">CONTRACTOR</div>
            <div style="font-size:12px;color:#64748b;margin-bottom:24px">${esc(cd.corpNum||co.name)}</div>
            <div style="border-top:1px solid #334155;padding-top:6px;margin-top:28px"><div style="font-size:10px;color:#94a3b8">Authorized Signature</div></div>
            <div style="border-top:1px solid #334155;padding-top:6px;margin-top:18px"><div style="font-size:10px;color:#94a3b8">Name: ________________________</div></div>
            <div style="border-top:1px solid #334155;padding-top:6px;margin-top:18px"><div style="font-size:10px;color:#94a3b8">Title: _________________________</div></div>
            <div style="border-top:1px solid #334155;padding-top:6px;margin-top:18px"><div style="font-size:10px;color:#94a3b8">Date: _________________________</div></div>
          </div>
          <div>
            <div style="font-weight:800;font-size:13px;color:#0f172a;margin-bottom:4px">CLIENT</div>
            <div style="font-size:12px;color:#64748b;margin-bottom:24px">${esc(cd.cName||"[Client Name]")}</div>
            <div style="border-top:1px solid #334155;padding-top:6px;margin-top:28px"><div style="font-size:10px;color:#94a3b8">Authorized Signature</div></div>
            <div style="border-top:1px solid #334155;padding-top:6px;margin-top:18px"><div style="font-size:10px;color:#94a3b8">Name: ${esc(cd.cContact||"________________________")}</div></div>
            <div style="border-top:1px solid #334155;padding-top:6px;margin-top:18px"><div style="font-size:10px;color:#94a3b8">Title: _________________________</div></div>
            <div style="border-top:1px solid #334155;padding-top:6px;margin-top:18px"><div style="font-size:10px;color:#94a3b8">Date: _________________________</div></div>
          </div>
        </div>
      </div>
    </div></div>`;
  }

  return`<div>Unknown tab</div>`;
}



// ═══════ MAIN APP SHELL ═══════
function renderApp(){
  const {view,page,selId,qPage,qSelId,invoices,clients,co,quotes}=S;
  const sel=invoices.find(i=>i.id===selId)||null;
  const qSel=quotes.find(q=>q.id===qSelId)||null;
  const overdueN=invoices.filter(i=>i.status!=="paid"&&i.status!=="cancelled"&&isOverdue(i)).length;
  const pendingQ=quotes.filter(q=>q.status==="sent").length;
  const NAV=[{id:"dashboard",l:"Dashboard",ic:"dash"},{id:"invoices",l:"Invoices",ic:"invoice",badge:overdueN||null},{id:"quotes",l:"Quotes",ic:"quote",badge:pendingQ||null},{id:"clients",l:"Clients",ic:"clients"},{id:"expenses",l:"Expenses",ic:"dollar"},{id:"employees",l:"Employees",ic:"users"},{id:"contracts",l:"Contracts",ic:"contract"},{id:"settings",l:"Settings",ic:"settings"}];
  const titles={dashboard:{h:"Dashboard",sub:"Financial overview"},invoices:{h:"Invoices",sub:`${invoices.length} total · ${overdueN} overdue`},quotes:{h:"Quotes",sub:`${quotes.length} quotes`},clients:{h:"Clients",sub:`${clients.length} clients`},expenses:{h:"Expenses",sub:`${S.expenses.length} entries`},employees:{h:"Employees",sub:`${S.employees.length} employees · Timesheets`},contracts:{h:"Contracts",sub:"Service agreements"},settings:{h:"Settings",sub:"Company & invoice defaults"}};
  let pageTitle="";
  if(view==="invoices"){if(page==="new")pageTitle="New Invoice";else if(page==="edit"&&sel)pageTitle=`Edit ${sel.number}`;else if(page==="preview"&&sel)pageTitle=sel.number;}
  if(view==="quotes"){if(qPage==="new")pageTitle="New Quote";else if(qPage==="edit"&&qSel)pageTitle=`Edit ${qSel.number}`;else if(qPage==="preview"&&qSel)pageTitle=qSel.number;}
  const h=pageTitle||titles[view]?.h||"",sub=!pageTitle?titles[view]?.sub||"":"";
  let content="";
  if(view==="dashboard")content=renderDashboard();
  else if(view==="invoices"){if(!page)content=renderInvoiceList();else if(page==="preview"&&sel)content=renderInvoicePreview(sel);else content=renderInvoiceForm(page==="edit"?sel:null);}
  else if(view==="quotes"){if(!qPage)content=renderQuotesList();else if(qPage==="preview"&&qSel)content=renderQuotePreview(qSel);else content=renderQuoteForm(qPage==="edit"?qSel:null);}
  else if(view==="clients")content=renderClientsView();
  else if(view==="expenses")content=renderExpensesView();
  else if(view==="employees")content=renderEmployeesView();
  else if(view==="contracts")content=renderContracts();
  else if(view==="settings")content=renderSettings();
  // confirm modal
  const modal=UI.confirm?`<div class="modal-ov" onclick="if(event.target===this){UI.confirm=null;render()}"><div class="modal fadein"><div class="modal-hd"><h2>${UI.confirm.title}</h2>${ibtn(IC.x,"Close","data-action='close-modal'")}</div><div class="modal-body"><p style="color:var(--dim);margin-bottom:20px;font-size:14px">${UI.confirm.body}</p><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn ${UI.confirm.btnClass}" data-action="confirm-ok">${UI.confirm.btnLabel}</button></div></div></div></div>`:"";
  return`<div class="app">
    <aside class="sb">
      <div class="sb-logo"><div class="sb-logo-name">Aqua <em>Quebec</em></div><div class="sb-logo-sub">Invoice Manager</div></div>
      <nav class="sb-nav"><div class="sb-sec">Navigation</div>${NAV.map(n=>`<button class="nav-btn${view===n.id?" active":""}" data-nav="${n.id}">${svg(IC[n.ic],16)}${n.l}${n.badge?`<span class="nav-badge">${n.badge}</span>`:""}</button>`).join("")}</nav>
      <div class="sb-foot"><strong>${esc(co.name)}</strong>${esc(co.email)}<br/>${co.currency} · ${co.defaultTaxRate}% tax</div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div class="topbar-title"><h1>${esc(h)}</h1>${sub?`<p>${esc(sub)}</p>`:""}</div>
        <div class="topbar-right">
          ${view==="invoices"&&!page?`<button class="btn btn-primary" data-action="go-new">${svg(IC.plus,14)} <span class="btn-label">New Invoice</span></button>`:""}
          ${view==="invoices"&&page?`<button class="btn btn-ghost btn-sm" data-action="${page==="preview"?"go-list":page==="edit"&&sel?"go-back-preview":"go-list"}">${svg(IC.back,14)} <span class="btn-label">${page==="new"||page==="edit"?"Discard":"Back"}</span></button>`:""}
          ${view==="quotes"&&!qPage?`<button class="btn btn-primary" data-action="go-qnew" style="background:#8b5cf6">${svg(IC.plus,14)} <span class="btn-label">New Quote</span></button>`:""}
          ${view==="quotes"&&qPage?`<button class="btn btn-ghost btn-sm" data-action="${qPage==="preview"?"go-qlist":qPage==="edit"&&qSel?"go-back-qpreview":"go-qlist"}">${svg(IC.back,14)} <span class="btn-label">${qPage==="new"||qPage==="edit"?"Discard":"Back"}</span></button>`:""}
        </div>
      </div>
      <div class="page">${content}</div>
    </main>
    <nav class="mobile-nav">${NAV.map(n=>`<button class="mob-nav-btn${view===n.id?" active":""}" data-nav="${n.id}">${svg(IC[n.ic],20)}${n.l}${n.badge?`<span class="nav-badge">${n.badge}</span>`:""}</button>`).join("")}</nav>
    ${view==="invoices"&&!page?`<button class="fab" data-action="go-new">+</button>`:""}
  </div>${modal}`;
}



// ═══════ EMPLOYEE PAY REPORT (print-ready) ═══════
function renderEmpPayReport(emp, sheets, payments, otRule, otAfter, otRate){
  const co=S.co;
  let grandW=0,grandR=0,grandO=0,grandTrvl=0,grandGross=0;
  const sheetRows=sheets.map(sheet=>{
    let wkly=0,tW=0,tR=0,tO=0;
    sheet.rows.forEach(row=>{
      const {worked}=calcShift(row.clockIn,row.clockOut,row.b1in,row.b1out,row.b2in,row.b2out);
      const {reg,ot}=applyOT(worked,wkly,otRule,otAfter,otRate);
      wkly+=worked;tW+=worked;tR+=reg;tO+=ot;
    });
    const trvl=(sheet.travel||[]).reduce((a,t)=>a+(+t.hrs||0),0);
    const payRate=emp.payRate||0;
    const gross=emp.payType==="salary"?null:(tR/60)*payRate+(tO/60)*payRate*otRate+trvl*payRate;
    grandW+=tW;grandR+=tR;grandO+=tO;grandTrvl+=trvl;
    if(gross!=null)grandGross+=gross;
    return{weekStart:sheet.weekStart,tW,tR,tO,trvl,gross};
  });
  const totalPaid=payments.reduce((a,p)=>a+(+p.amount||0),0);
  const balance=grandGross-totalPaid;
  const METHOD_COLORS={"Cash":"#10b981","Cheque":"#3b82f6","E-Transfer":"#8b5cf6","Direct Deposit":"#f59e0b","Other":"#94a3b8"};

  return`<div style="font-family:Arial,sans-serif;color:#0f172a;font-size:12px;padding:24px;max-width:900px;margin:0 auto">
  <!-- Header -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
    <div>
      <div style="font-size:20px;font-weight:800">${esc(co.name)}</div>
      <div style="font-size:11px;color:#64748b">${esc(co.tagline||"")}</div>
      <div style="font-size:11px;color:#64748b;margin-top:4px">${esc(co.address)} · ${esc(co.phone)} · ${esc(co.email)}</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:14px;font-weight:800;color:#d97706">EMPLOYEE PAY REPORT</div>
      <div style="font-size:12px;color:#64748b;margin-top:4px">Printed: ${new Date().toLocaleDateString("en-CA",{year:"numeric",month:"long",day:"numeric"})}</div>
    </div>
  </div>
  <div style="height:2px;background:linear-gradient(90deg,#f59e0b,#e2e8f0);margin-bottom:20px"></div>

  <!-- Employee info -->
  <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px 18px;margin-bottom:20px;display:flex;gap:40px;flex-wrap:wrap">
    <div><div style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8;margin-bottom:4px">Employee</div><div style="font-size:16px;font-weight:800;color:#0f172a">${esc(emp.name)}</div><div style="font-size:12px;color:#64748b">${esc(emp.role||"")}</div></div>
    ${emp.sin?`<div><div style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8;margin-bottom:4px">SIN</div><div style="font-size:13px;font-weight:700">***-***-${esc(emp.sin)}</div></div>`:""}
    <div><div style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8;margin-bottom:4px">Pay Type</div><div style="font-size:13px;font-weight:700">${emp.payType==="salary"?"Salary":"$"+Number(emp.payRate||0).toFixed(2)+"/hr"}</div></div>
    <div><div style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8;margin-bottom:4px">Start Date</div><div style="font-size:13px;font-weight:700">${emp.startDate?fd(emp.startDate):"—"}</div></div>
    <div><div style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8;margin-bottom:4px">OT Rule</div><div style="font-size:13px;font-weight:700">${otRule==="daily"?`After ${otAfter}h/day`:`After ${otAfter}h/week`} · ${otRate}×</div></div>
  </div>

  <!-- Summary boxes -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px">
    ${[
      {l:"Total Hours",v:minsToH(grandW)+"h",sub:`${minsToH(grandR)}h reg + ${minsToH(grandO)}h OT`,c:"#3b82f6"},
      {l:"Travel",v:grandTrvl>0?grandTrvl.toFixed(2)+"h":"—",sub:"travel time",c:"#8b5cf6"},
      {l:"Gross Earned",v:emp.payType==="salary"?"Salary":fc(grandGross),sub:emp.payType==="salary"?"calculated separately":"incl. OT & travel",c:"#f59e0b"},
      {l:balance>0?"Balance Owing":"Fully Paid",v:emp.payType==="salary"?"—":fc(Math.abs(balance)),sub:emp.payType!=="salary"&&balance<=0?"All payments recorded":balance>0?"Remaining to pay":"",c:balance>0&&emp.payType!=="salary"?"#ef4444":"#10b981"},
    ].map(k=>`<div style="background:#fff;border:2px solid ${k.c}30;border-radius:8px;padding:12px 14px">
      <div style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8;margin-bottom:6px">${k.l}</div>
      <div style="font-size:18px;font-weight:800;color:${k.c};font-family:monospace">${k.v}</div>
      <div style="font-size:10px;color:#94a3b8;margin-top:3px">${k.sub}</div>
    </div>`).join("")}
  </div>

  <!-- Timesheet history -->
  <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8;margin-bottom:8px">Timesheet Summary</div>
  <table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:24px">
    <thead><tr style="background:#f1f5f9">
      ${["Week","Regular Hrs","Overtime Hrs","Total Hrs","Travel Hrs","Gross Pay"].map(h=>`<th style="padding:8px 10px;text-align:${h==="Gross Pay"?"right":"center"};border:1px solid #e2e8f0;font-size:9px;font-weight:700;text-transform:uppercase;color:#64748b;letter-spacing:.05em">${h}</th>`).join("")}
    </tr></thead>
    <tbody>
      ${sheetRows.length===0?`<tr><td colspan="6" style="padding:24px;text-align:center;border:1px solid #e2e8f0;color:#94a3b8">No timesheets recorded.</td></tr>`:""}
      ${sheetRows.map((r,i)=>`<tr style="background:${i%2===0?"#fff":"#f8fafc"}">
        <td style="padding:7px 10px;border:1px solid #e2e8f0;font-weight:600">${weekLabel(r.weekStart)}</td>
        <td style="padding:7px 10px;border:1px solid #e2e8f0;text-align:center;color:#16a34a;font-weight:700">${minsToH(r.tR)}h</td>
        <td style="padding:7px 10px;border:1px solid #e2e8f0;text-align:center;color:#ea580c;font-weight:700">${r.tO>0?minsToH(r.tO)+"h":"—"}</td>
        <td style="padding:7px 10px;border:1px solid #e2e8f0;text-align:center;font-weight:800;color:#1e40af">${minsToH(r.tW)}h</td>
        <td style="padding:7px 10px;border:1px solid #e2e8f0;text-align:center;color:#64748b">${r.trvl>0?r.trvl.toFixed(2)+"h":"—"}</td>
        <td style="padding:7px 10px;border:1px solid #e2e8f0;text-align:right;font-weight:700">${r.gross!=null?fc(r.gross):"—"}</td>
      </tr>`).join("")}
      ${sheetRows.length>0?`<tr style="background:#fffbeb;font-weight:800">
        <td style="padding:8px 10px;border:1px solid #e2e8f0;text-align:right;color:#92400e;font-size:11px">TOTALS</td>
        <td style="padding:8px 10px;border:1px solid #e2e8f0;text-align:center;color:#16a34a">${minsToH(grandR)}h</td>
        <td style="padding:8px 10px;border:1px solid #e2e8f0;text-align:center;color:#ea580c">${grandO>0?minsToH(grandO)+"h":"—"}</td>
        <td style="padding:8px 10px;border:1px solid #e2e8f0;text-align:center;color:#1e40af">${minsToH(grandW)}h</td>
        <td style="padding:8px 10px;border:1px solid #e2e8f0;text-align:center;color:#64748b">${grandTrvl>0?grandTrvl.toFixed(2)+"h":"—"}</td>
        <td style="padding:8px 10px;border:1px solid #e2e8f0;text-align:right;color:#d97706">${emp.payType==="salary"?"—":fc(grandGross)}</td>
      </tr>`:""}
    </tbody>
  </table>

  <!-- Payment log -->
  <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8;margin-bottom:8px">Payment Log</div>
  <table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:24px">
    <thead><tr style="background:#f1f5f9">
      ${["Date","Method","Hours Covered","Notes","Amount"].map(h=>`<th style="padding:8px 10px;text-align:${h==="Amount"?"right":"left"};border:1px solid #e2e8f0;font-size:9px;font-weight:700;text-transform:uppercase;color:#64748b;letter-spacing:.05em">${h}</th>`).join("")}
    </tr></thead>
    <tbody>
      ${payments.length===0?`<tr><td colspan="5" style="padding:24px;text-align:center;border:1px solid #e2e8f0;color:#94a3b8">No payments recorded.</td></tr>`:""}
      ${payments.map((p,i)=>`<tr style="background:${i%2===0?"#fff":"#f8fafc"}">
        <td style="padding:7px 10px;border:1px solid #e2e8f0;font-weight:600">${fd(p.date)}</td>
        <td style="padding:7px 10px;border:1px solid #e2e8f0"><span style="display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;background:${METHOD_COLORS[p.method]||"#94a3b8"}20;color:${METHOD_COLORS[p.method]||"#94a3b8"}">${esc(p.method||"—")}</span></td>
        <td style="padding:7px 10px;border:1px solid #e2e8f0;color:#475569">${p.hours>0?p.hours+"h":"—"}</td>
        <td style="padding:7px 10px;border:1px solid #e2e8f0;color:#64748b">${esc(p.notes||"—")}</td>
        <td style="padding:7px 10px;border:1px solid #e2e8f0;text-align:right;font-weight:700;color:#16a34a;font-family:monospace">${fc(p.amount)}</td>
      </tr>`).join("")}
      ${payments.length>0?`<tr style="background:#f0fdf4;font-weight:800">
        <td colspan="4" style="padding:8px 10px;border:1px solid #e2e8f0;text-align:right;color:#166534">TOTAL PAID</td>

// updateTimeVal: called by time picker selects to rebuild the time string
function updateTimeVal(sel){
  const container=sel.closest("[data-tsp-empid]");
  if(!container)return;
  const empId=container.dataset.tspEmpid;
  const rowIdx=+container.dataset.tspRow;
  const field=container.dataset.tspField;
  const h=container.querySelector("[data-tsp-part='h']")?.value||"";
  const m=container.querySelector("[data-tsp-part='m']")?.value||"00";
  const ap=container.querySelector("[data-tsp-part='ap']")?.value||"AM";
  const val=h?`${h}:${m} ${ap}`:"";
  // update state
  if(!UI._tsSheets)UI._tsSheets={};
  if(!UI._tsSheets[empId]){
    const ws=UI.tsWeek||getWeekStart(today());
    const existing=S.timesheets.find(t=>t.empId===empId&&t.weekStart===ws);
    UI._tsSheets[empId]=existing?JSON.parse(JSON.stringify(existing)):getOrCreateSheet(empId,ws);
  }
  if(UI._tsSheets[empId].rows[rowIdx]){
    UI._tsSheets[empId].rows[rowIdx][field]=val;
  }
  // recalc this row display
  const ws=UI.tsWeek||getWeekStart(today());
  const co=S.co;
  const otRule=co.otRule||"daily",otAfter=+co.otAfter||8,otRate=+co.otRate||1.5;
  const sheet=UI._tsSheets[empId];
  let wklyPre=0;
  for(let j=0;j<rowIdx;j++){
    const {worked}=calcShift(sheet.rows[j].clockIn,sheet.rows[j].clockOut,sheet.rows[j].b1in,sheet.rows[j].b1out,sheet.rows[j].b2in,sheet.rows[j].b2out);
    wklyPre+=worked;
  }
  const row=sheet.rows[rowIdx];
  const {worked}=calcShift(row.clockIn,row.clockOut,row.b1in,row.b1out,row.b2in,row.b2out);
  const {reg,ot}=applyOT(worked,wklyPre,otRule,otAfter,otRate);
  const wEl=document.getElementById(`w-${empId}-${rowIdx}`);if(wEl)wEl.textContent=worked>0?minsToH(worked):"—";
  const rEl=document.getElementById(`r-${empId}-${rowIdx}`);if(rEl)rEl.textContent=reg>0?minsToH(reg):"—";
  const oEl=document.getElementById(`o-${empId}-${rowIdx}`);if(oEl)oEl.textContent=ot>0?minsToH(ot):"—";
  // update column totals
  let totW=0,totR=0,totO=0,wkly2=0;
  sheet.rows.forEach(r2=>{
    const {worked:w2}=calcShift(r2.clockIn,r2.clockOut,r2.b1in,r2.b1out,r2.b2in,r2.b2out);
    const {reg:reg2,ot:ot2}=applyOT(w2,wkly2,otRule,otAfter,otRate);
    wkly2+=w2;totW+=w2;totR+=reg2;totO+=ot2;
  });
  const wtEl=document.getElementById(`wt-${empId}`);if(wtEl)wtEl.textContent=minsToH(totW);
  const rtEl=document.getElementById(`rt-${empId}`);if(rtEl)rtEl.textContent=minsToH(totR);
  const otEl=document.getElementById(`ot-${empId}`);if(otEl)otEl.textContent=minsToH(totO);
  // update header summary cards
  const payRate=S.employees.find(e=>e.id===empId)?.payRate||0;
  const emp=S.employees.find(e=>e.id===empId);
  const trvl=(UI._tsTravel?.[ws]||[]).reduce((a,t)=>a+(+t.hrs||0),0);
  const gross=emp?.payType==="salary"?0:(totR/60)*payRate+(totO/60)*payRate*otRate+trvl*payRate;
  const blk=document.getElementById(`emp-block-${empId}`);
  if(blk){
    const vals=blk.querySelectorAll(".ts-reg,.ts-ot,.ts-total");
    // header cards: first 3 spans in header area
    const hdr=blk.querySelector("[style*='border-radius:8px']");
  }
}

// ── Timesheet footer live-update helpers
function _updateTsFooter(){
  const empId=UI.tsEmpId||S.employees[0]?.id;
  const ws=UI.tsWeek||getWeekStart(today());
  const sheet=UI._tsSheet||getOrCreateSheet(empId,ws);
  const co=S.co;
  let weeklyWorked=0,totW=0,totR=0,totO=0;
  // scrape live values from DOM
  const table=document.getElementById("ts-main");
  if(!table)return;
  sheet.rows.forEach((row,i)=>{
    // read from DOM if available
    const tr=table.querySelectorAll("tbody tr")[i];
    if(tr){
      tr.querySelectorAll("[data-ts-field]").forEach(inp=>{row[inp.dataset.tsField]=inp.value;});
    }
    const {worked}=calcShift(row.clockIn,row.clockOut,row.b1in,row.b1out,row.b2in,row.b2out);
    const {reg,ot}=applyOT(worked,weeklyWorked,co.otRule||"daily",co.otAfter||8,co.otRate||1.5);
    weeklyWorked+=worked;totW+=worked;totR+=reg;totO+=ot;
  });
  const tfoot=table.querySelector("tfoot tr");
  if(tfoot){
    const spans=tfoot.querySelectorAll("span");
    if(spans[0])spans[0].textContent=minsToH(totW);
    if(spans[1])spans[1].textContent=minsToH(totR);
    if(spans[2])spans[2].textContent=minsToH(totO);
  }
  // update summary cards
  const cards=document.querySelectorAll(".ts-summary-reg,.ts-summary-ot,.ts-summary-tot");
  cards.forEach(c=>{
    if(c.classList.contains("ts-summary-reg"))c.textContent=minsToH(totR)+"h";
    if(c.classList.contains("ts-summary-ot"))c.textContent=minsToH(totO)+"h";
    if(c.classList.contains("ts-summary-tot"))c.textContent=minsToH(totW)+"h";
  });
}
function _updateTravelFooter(){
  const table=document.getElementById("ts-travel");if(!table)return;
  let tot=0;
  table.querySelectorAll("[data-tt-field='hrs']").forEach(inp=>{tot+=+inp.value||0;});
  const tfoot=table.querySelector("tfoot td span");
  if(tfoot)tfoot.textContent=tot.toFixed(2);
}

      else if(a==="emp-tab"){UI.empTab=el.dataset.tab;if(el.dataset.tab==="timesheet"){UI.tsWeek=UI.tsWeek||getWeekStart(today());if(!UI.tsEmpIds)UI.tsEmpIds=S.employees.filter(e=>e.active!==false).map(e=>e.id);if(!UI._tsSheets)UI._tsSheets={};}render();}

      else if(a==="emp-add-payment"){

        const hours=+(document.getElementById("pf-hours")?.value)||0;

        if(!S.empPayments)S.empPayments=[];
        const exists=S.empPayments.find(x=>x.id===pay.id);
        S.empPayments=exists?S.empPayments.map(x=>x.id===pay.id?pay:x):[pay,...S.empPayments];
        UI.empPayEditing=undefined;persist();render();toast("Payment saved");
      }
      else if(a==="emp-del-payment"){
        const pid=el.dataset.pid;
        const p=(S.empPayments||[]).find(x=>x.id===pid);
        UI.confirm={title:"Delete Payment",body:`Delete this payment record of <strong>${p?fc(p.amount):"$?"}</strong>? This cannot be undone.`,btnLabel:"Delete",btnClass:"btn-danger",
          onOk:()=>{S.empPayments=(S.empPayments||[]).filter(x=>x.id!==pid);persist();render();toast("Payment deleted","err");}};

      else if(a==="emp-print-report"){
        const empId=el.dataset.empid||UI.histEmpId||S.employees[0]?.id;

        const otRule=co.otRule||"daily",otAfter=+co.otAfter||8,otRate=+co.otRate||1.5;

        const payments=(S.empPayments||[]).filter(p=>p.empId===empId).sort((a,b)=>b.date>a.date?1:-1);
        const reportHtml=emp?renderEmpPayReport(emp,sheets,payments,otRule,otAfter,otRate):"<p>No data.</p>";

      else if(a==="open-sheet"){
        UI.empTab="timesheet";UI.tsEmpId=el.dataset.empid;UI.tsWeek=el.dataset.week;
        const existing=S.timesheets.find(t=>t.empId===el.dataset.empid&&t.weekStart===el.dataset.week);
        UI._tsSheet=existing?JSON.parse(JSON.stringify(existing)):null;

      else if(a==="ts-toggle-emp"){

          printDiv.innerHTML=renderWeekReport(ws,selEmps,otRule,otAfter,otRate,travel);

        if(UI._tsTravel?.[ws])UI._tsTravel[ws].splice(+el.dataset.tridx,1);

      }
      else if(a==="save-ts"){
        const ws=UI.tsWeek||getWeekStart(today());
        // scrape all text inputs
        document.querySelectorAll("[data-me-emp]").forEach(inp=>{
          const eid=inp.dataset.meEmp,ri=+inp.dataset.meRow,f=inp.dataset.meField;
          if(UI._tsSheets?.[eid]?.rows?.[ri])UI._tsSheets[eid].rows[ri][f]=inp.value;

        const travel=UI._tsTravel?.[ws]||[];
        document.querySelectorAll("[data-tt-row]").forEach(inp=>{
          const i=+inp.dataset.ttRow,f=inp.dataset.ttField;

        });
        if(UI._tsTravel)UI._tsTravel[ws]=travel;
        // save each employee sheet, attaching travel to first employee's sheet for storage
        let first=true;
        (UI.tsEmpIds||[]).forEach(empId=>{
          const sheet=UI._tsSheets?.[empId];
          if(!sheet)return;
          sheet.travel=first?[...travel]:[];
          first=false;
          saveSheet(sheet);
        });
        toast("All timesheets saved");
      }
      else if(a==="save-ot-settings"){
        const form=document.getElementById("ot-form");if(!form)return;
        const newCo={...S.co};
        form.querySelectorAll("[data-ot]").forEach(inp=>{
          newCo[inp.dataset.ot]=inp.dataset.ot==="otRule"?inp.value:+inp.value;

        S.co=newCo;persist();render();toast("OT settings saved");

}


  // ── Multi-employee text fields (vessel, notes) — no re-render
  document.querySelectorAll("[data-me-emp]").forEach(el=>{
    el.addEventListener("input",()=>{

      let tot=0;document.querySelectorAll("[data-tt-field='hrs']").forEach(inp=>tot+=+inp.value||0);

  const histEmpSel2=document.getElementById("hist-emp-sel");
  if(histEmpSel2)histEmpSel2.onchange=e=>{UI.histEmpId=e.target.value;render();};

// Boot
render();

<script>
/* ═══════ Passcode gate logic (client-side only) ═══════
   NOTE: This is a lightweight gate to keep the invoice tool out of casual
   view. It is NOT strong security — the passcode check runs in the browser.
   To change the passcode: run  sha256("your-new-passcode")  in the browser
   console (this page exposes the function) and paste the result into
   AUTH_HASH below. Default passcode: aquaquebec2024
*/
(function () {
  "use strict";
  var AUTH_HASH = "47700a778795d9ba1f473588ff73fa3028b7d4069928424fe0df4e654b7ab415";
  var AUTH_KEY = "aq_admin_ok";

  function sha256(ascii){
    function rr(v,a){return (v>>>a)|(v<<(32-a));}
    ascii = unescape(encodeURIComponent(ascii));
    var mp=Math.pow, mw=mp(2,32), L='length', i, j, result='';
    var words=[], bitLen=ascii[L]*8;
    var hash=sha256.h=sha256.h||[], k=sha256.k=sha256.k||[], pc=k[L];
    var comp={};
    for (var cand=2; pc<64; cand++){
      if(!comp[cand]){
        for(i=0;i<313;i+=cand){comp[i]=cand;}
        hash[pc]=(mp(cand,.5)*mw)|0;
        k[pc++]=(mp(cand,1/3)*mw)|0;
      }
    }
    ascii+='\x80';
    while(ascii[L]%64-56) ascii+='\x00';
    for(i=0;i<ascii[L];i++){ j=ascii.charCodeAt(i); if(j>>8) return; words[i>>2]|=j<<((3-i)%4)*8; }
    words[words[L]]=((bitLen/mw)|0);
    words[words[L]]=(bitLen);
    for(j=0;j<words[L];){
      var w=words.slice(j,j+=16), oldHash=hash;
      hash=hash.slice(0,8);
      for(i=0;i<64;i++){
        var w15=w[i-15], w2=w[i-2];
        var a=hash[0], e=hash[4];
        var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
          +(w[i]=i<16?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
        var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
        hash=[(t1+t2)|0].concat(hash);
        hash[4]=(hash[4]+t1)|0;
      }
      for(i=0;i<8;i++){ hash[i]=(hash[i]+oldHash[i])|0; }
    }
    for(i=0;i<8;i++){ for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; result+=((b<16)?0:'')+b.toString(16); } }
    return result;
  }
  window.sha256 = sha256; // exposed so you can generate a new AUTH_HASH from the console

  var gate=document.getElementById('authGate');
  var appEl=document.getElementById('app');
  var lockBtn=document.getElementById('lockBtn');
  var pass=document.getElementById('authPass');
  var err=document.getElementById('authErr');

  function unlock(){ gate.style.display='none'; appEl.style.display='block'; lockBtn.style.display='inline-flex'; }
  function lock(){
    try{ sessionStorage.removeItem(AUTH_KEY); }catch(e){}
    gate.style.display='flex'; appEl.style.display='none'; lockBtn.style.display='none';
    err.textContent=''; pass.value=''; pass.focus();
  }

  var authed=false;
  try{ authed = sessionStorage.getItem(AUTH_KEY)==='1'; }catch(e){}
  if(authed){ unlock(); } else { gate.style.display='flex'; appEl.style.display='none'; setTimeout(function(){pass.focus();},50); }

  document.getElementById('authForm').addEventListener('submit', function(e){
    e.preventDefault();
    if(sha256(pass.value)===AUTH_HASH){
      try{ sessionStorage.setItem(AUTH_KEY,'1'); }catch(e){}
      err.textContent=''; unlock();
    } else {
      err.textContent='Mot de passe incorrect · Wrong password';
      var c=document.querySelector('.auth-card');
      c.classList.remove('auth-shake'); void c.offsetWidth; c.classList.add('auth-shake');
      pass.select();
    }
  });
  lockBtn.addEventListener('click', lock);
})();
</script>
